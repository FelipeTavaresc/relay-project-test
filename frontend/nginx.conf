# Serves the built Angular bundle. Nothing is proxied: the SPA calls the API directly at the
# origin baked in at build time (API_BASE_URL), and the API allowlists that origin for CORS.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The Angular router owns every path, and the dashboard's state lives in the query string.
    # Without this, reloading a deep link (`/?window=90&locations=Site+O`) would 404 in nginx
    # before the app ever booted — which is precisely the reload FR21 requires to work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles (outputHashing: all) are safe to cache forever; index.html must not be,
    # or a rebuilt image keeps serving the previous bundle's script references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
